apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: codeforphilly
  namespace: codeforphilly-ng
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-gateway
spec:
  gatewayClassName: eg
  listeners:
    # Pre-cutover host. At cutover, move the `codeforphilly.org` and
    # `www.codeforphilly.org` listeners here from _gateways/code-for-philly.yaml
    # (and the matching HTTPRoute hostnames below) in one commit. Rollback is a
    # revert of that commit.
    - name: https-next
      protocol: HTTPS
      port: 443
      hostname: next.codeforphilly.org
      tls:
        mode: Terminate
        certificateRefs:
          - name: next-codeforphilly-org-gw-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: codeforphilly
  namespace: codeforphilly-ng
spec:
  parentRefs:
    - name: codeforphilly
  hostnames:
    - next.codeforphilly.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: codeforphilly
          port: 80
