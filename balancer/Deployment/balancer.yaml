apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: balancer
  name: balancer
  namespace: balancer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: balancer
  strategy: {}
  template:
    metadata:
      annotations:
        cfp.io/config-revision: 2026-10-cnpg-cutover
      labels:
        app: balancer
    spec:
      containers:
        - args:
            - python
            - manage.py
            - runserver
            - 0.0.0.0:8000
            - '--noreload'
            - '--insecure'
          envFrom:
            - secretRef:
                name: balancer-config
            - configMapRef:
                name: balancer-config
          image: ghcr.io/codeforphilly/balancer-main/app:1.1.5
          name: app
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /admin/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
