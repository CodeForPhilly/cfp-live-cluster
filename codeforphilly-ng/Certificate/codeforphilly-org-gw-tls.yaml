apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: codeforphilly-org-gw-tls
  namespace: codeforphilly-ng
spec:
  dnsNames:
    - codeforphilly.org
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod-gateway
  secretName: codeforphilly-org-gw-tls
  usages:
    - digital signature
    - key encipherment
