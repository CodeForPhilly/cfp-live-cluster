apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-gateway
  name: balancer
  namespace: balancer
spec:
  gatewayClassName: eg
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: balancerproject.org
      name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: balancer-gw-tls
        mode: Terminate
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: www.balancerproject.org
      name: https-www
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - name: www-balancerproject-org-gw-tls
        mode: Terminate
