apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sealed-secrets
  namespace: sealed-secrets
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: sealed-secrets.live.k8s.phl.io
      tls:
        mode: Terminate
        certificateRefs:
          - name: sealed-secrets-gw-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sealed-secrets
  namespace: sealed-secrets
spec:
  parentRefs:
    - name: sealed-secrets
  hostnames:
    - sealed-secrets.live.k8s.phl.io
  rules:
    # Only the public cert. The Ingress this replaced exposed exactly
    # /v1/cert.pem; the catch-all "/" written in phase 3 silently published the
    # rest of the controller's HTTP surface as well. Narrow it back.
    - matches:
        - path:
            type: Exact
            value: /v1/cert.pem
      backendRefs:
        - name: sealed-secrets
          port: 8080
---
# Accept the PROXY protocol header the NodeBalancer adds so Envoy sees the
# real client address (and puts it in X-Forwarded-For). One identical policy
# per Gateway: with mergeGateways the filter is set per port from whichever
# merged listener carries it, so attaching it everywhere is deterministic.
# `optional: true` keeps connections WITHOUT a header working — in-cluster
# traffic (cert-manager's HTTP-01 self-check, anything hitting the LB IP from
# inside) never traverses the NodeBalancer. See #201 and the July incident.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: proxy-protocol
  namespace: sealed-secrets
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: sealed-secrets
  proxyProtocol:
    optional: true
