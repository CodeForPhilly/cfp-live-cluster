apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: codeforphilly
  namespace: codeforphilly-ng
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-gateway
spec:
  gatewayClassName: eg
  listeners:
    # Production hostnames for the codeforphilly.org rewrite. The apex and www
    # listeners moved here from _gateways/code-for-philly.yaml at cutover;
    # rollback is a revert of that commit. `next.` stays as a secondary host.
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: codeforphilly.org
      tls:
        mode: Terminate
        certificateRefs:
          - name: codeforphilly-org-gw-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-www
      protocol: HTTPS
      port: 443
      hostname: www.codeforphilly.org
      tls:
        mode: Terminate
        certificateRefs:
          - name: www-codeforphilly-org-gw-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-next
      protocol: HTTPS
      port: 443
      hostname: next.codeforphilly.org
      tls:
        mode: Terminate
        certificateRefs:
          - name: next-codeforphilly-org-gw-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: codeforphilly
  namespace: codeforphilly-ng
spec:
  parentRefs:
    - name: codeforphilly
  hostnames:
    - codeforphilly.org
    - www.codeforphilly.org
    - next.codeforphilly.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: codeforphilly
          port: 80
---
# Accept the PROXY protocol header the NodeBalancer adds so Envoy sees the
# real client address (and puts it in X-Forwarded-For). One identical policy
# per Gateway: with mergeGateways the filter is set per port from whichever
# merged listener carries it, so attaching it everywhere is deterministic.
# `optional: true` keeps connections WITHOUT a header working — in-cluster
# traffic (cert-manager's HTTP-01 self-check, anything hitting the LB IP from
# inside) never traverses the NodeBalancer. See #201 and the July incident.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: proxy-protocol
  namespace: codeforphilly-ng
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: codeforphilly
  proxyProtocol:
    optional: true
