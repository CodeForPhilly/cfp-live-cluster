site:
  name: code-for-philly
  title: "Code for Philly"
  canonicalHostname: codeforphilly.org
  # canonicalHostname: codeforphilly.live.k8s.phl.io

  image:
    repository: ghcr.io/codeforphilly/codeforphilly.org
    tag: 1.3.17

  secrets:
    - name: 'discourse'
    - name: 'email'
    - name: 'github'
    - name: 'mailchimp'
    - name: 'recaptcha'
    - name: 'saml2'
    - name: 'slack'

# Routing is handled by Envoy Gateway — see _gateways/code-for-philly.yaml.
ingress:
  enabled: false


volumes:
  site: 10Gi
  database: 50Gi

# Backups off since 2026-10-17: this is the legacy site, kept reachable at its
# non-production hostname after codeforphilly-ng replaced it. Nothing here
# changes anymore. The last restic snapshots (codeforphilly-restic bucket,
# us-southeast) are from 2026-10-17 if it ever needs restoring.
backups:
  enabled: false

hab:
  license: accept-no-persist
