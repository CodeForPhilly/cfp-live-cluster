apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-cluster
  namespace: cloudnative-pg
spec:
  instances: 2
  # Pinned by digest: the tag floats, which left sandbox and live on different
  # Postgres patch releases. Bump the digest deliberately, both clusters at once.
  imageName: ghcr.io/cloudnative-pg/postgis:18-3-system-trixie@sha256:a2b2fc7941fe97a27728ecb285df0b35f0341b63bef98a8e4328723a0417f828

  storage:
    # Explicit, unlike sandbox, which takes the cluster default. `-retain` keeps
    # the Linode volume if the PVC is ever deleted — on this cluster that is the
    # difference between an incident and an outage.
    storageClass: linode-block-storage-retain
    size: 20Gi

  # Roles are managed here (not via the 1.30 DatabaseRole CRD) to match
  # cfp-sandbox-cluster. Each role's passwordSecret is sealed in
  # cloudnative-pg.secrets/ and must exist before the role is declared, or
  # cnpg reports a role reconcile error until it does.
  managed:
    roles:
      - name: balancer
        login: true
        passwordSecret:
          name: balancer-db-credentials

  # Backups: WAL archiving + nightly base backups to GCS (off-Linode) via
  # the Barman Cloud plugin. See backups.yaml for the ObjectStore + schedule.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: gcs-cnpg
