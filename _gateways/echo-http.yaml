apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: echo-http
  namespace: echo-http
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: echo-http.live.k8s.phl.io
      tls:
        mode: Terminate
        certificateRefs:
          - name: echo-http-gw-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-http
  namespace: echo-http
spec:
  parentRefs:
    - name: echo-http
  hostnames:
    - echo-http.live.k8s.phl.io
  rules:
    - backendRefs:
        - name: echo-http
          port: 80
---
# Accept the PROXY protocol header the NodeBalancer adds so Envoy sees the
# real client address (and puts it in X-Forwarded-For). One identical policy
# per Gateway: with mergeGateways the filter is set per port from whichever
# merged listener carries it, so attaching it everywhere is deterministic.
# `optional: true` keeps connections WITHOUT a header working — in-cluster
# traffic (cert-manager's HTTP-01 self-check, anything hitting the LB IP from
# inside) never traverses the NodeBalancer. See #201 and the July incident.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: proxy-protocol
  namespace: echo-http
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: echo-http
  proxyProtocol:
    optional: true
