apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: third-places
  namespace: third-places
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: third-places.live.k8s.phl.io
      tls:
        mode: Terminate
        certificateRefs:
          - name: third-places-gw-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: third-places
  namespace: third-places
spec:
  parentRefs:
    - name: third-places
  hostnames:
    - third-places.live.k8s.phl.io
  rules:
    # Django serves the API and admin; everything else is the frontend SPA.
    # Gateway API matches the longest path prefix, so these win over "/" below
    # regardless of rule order. Mirrors the Ingress this replaced — without the
    # split, "/" lands on Django and the site 404s.
    - matches:
        - path:
            type: PathPrefix
            value: /api/
        - path:
            type: PathPrefix
            value: /admin/
        - path:
            type: PathPrefix
            value: /static/admin/
      backendRefs:
        - name: third-places
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: third-places-frontend
          port: 80
---
# Accept the PROXY protocol header the NodeBalancer adds so Envoy sees the
# real client address (and puts it in X-Forwarded-For). One identical policy
# per Gateway: with mergeGateways the filter is set per port from whichever
# merged listener carries it, so attaching it everywhere is deterministic.
# `optional: true` keeps connections WITHOUT a header working — in-cluster
# traffic (cert-manager's HTTP-01 self-check, anything hitting the LB IP from
# inside) never traverses the NodeBalancer. See #201 and the July incident.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: proxy-protocol
  namespace: third-places
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: third-places
  proxyProtocol:
    optional: true
