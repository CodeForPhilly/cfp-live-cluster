apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: balancer

# balancer-main v1.1.7 owns its own HTTPRoute (paths, backends, ports) and no
# longer ships an Ingress. This repo owns the Gateway — hostname, TLS, issuer —
# in _gateways/balancer.yaml. The route attaches to it by name and declares no
# hostnames, so it inherits the Gateway's listener hostname.
#
# We deliberately do not take upstream's gateway-listeners.yaml, and v1.1.7
# removed it: it declared a ListenerSet, which Envoy Gateway v1.7.3 does not
# reconcile ("XListenerSet CRD not found, skipping XListenerSet watch"). It
# would apply cleanly and then be silently ignored.
resources:
  - manifests/namespace.yaml
  - manifests/deployment.yaml
  - manifests/service.yaml
  - manifests/httproute.yaml

# Stays on the running version. v1.1.7 is a deploy-manifest release with no
# application changes, so bumping the image here would ship app code under cover
# of a routing change. Bump it deliberately, on its own.
images:
  - name: ghcr.io/codeforphilly/balancer-main/app
    newTag: "1.1.5"

# v1.1.7's Deployment does `envFrom: configMapRef: balancer-config` alongside
# `secretRef: balancer-config` (our SealedSecret). A ConfigMap and a Secret may
# share a name. The ConfigMap is listed second, so its keys win on overlap.
# balancer.env (ours, not upstream's empty one) carries the cnpg connection
# settings; the Secret keeps only SECRET_KEY, SQL_PASSWORD and the API keys.
configMapGenerator:
  - name: balancer-config
    envs:
      - balancer.env

generatorOptions:
  disableNameSuffixHash: true

patches:
  # disableNameSuffixHash keeps the ConfigMap name stable, which also means a
  # changed ConfigMap does not roll the pod by itself. Bump this annotation
  # whenever balancer.env or the SealedSecret changes and the app must restart.
  - target:
      kind: Deployment
      name: balancer
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          cfp.io/config-revision: "2026-10-cnpg-cutover"
  # The image's CMD is `runserver ... --noreload`. With DEBUG off (balancer.env)
  # Django's dev server no longer serves /static/, which is where the SPA
  # bundle and the admin CSS live, so the site renders blank. --insecure keeps
  # static serving on. The real fix is whitenoise (or a proper WSGI server) in
  # balancer-main; this patch goes away when that lands.
  - target:
      kind: Deployment
      name: balancer
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value: ["python", "manage.py", "runserver", "0.0.0.0:8000", "--noreload", "--insecure"]
  - target:
      kind: Namespace
      name: balancer
    patch: |-
      - op: replace
        path: /metadata/name
        value: balancer
