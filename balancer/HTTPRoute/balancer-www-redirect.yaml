apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: balancer-www-redirect
  namespace: balancer
spec:
  hostnames:
    - www.balancerproject.org
  parentRefs:
    - name: balancer
      sectionName: https-www
  rules:
    - filters:
        - requestRedirect:
            hostname: balancerproject.org
            statusCode: 301
          type: RequestRedirect
