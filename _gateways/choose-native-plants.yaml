apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: choose-native-plants
  namespace: choose-native-plants
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: https-subdomain
      protocol: HTTPS
      port: 443
      hostname: choose-native-plants.live.k8s.phl.io
      tls:
        mode: Terminate
        certificateRefs:
          - name: choose-native-plants-gw-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: choosenativeplants.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: choosenativeplants-com-gw-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-www
      protocol: HTTPS
      port: 443
      hostname: www.choosenativeplants.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: www-choosenativeplants-com-gw-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: choose-native-plants
  namespace: choose-native-plants
spec:
  parentRefs:
    - name: choose-native-plants
  hostnames:
    - choose-native-plants.live.k8s.phl.io
    - choosenativeplants.com
    - www.choosenativeplants.com
  rules:
    - backendRefs:
        - name: choose-native-plants
          port: 80
---
# Accept the PROXY protocol header the NodeBalancer adds so Envoy sees the
# real client address (and puts it in X-Forwarded-For). One identical policy
# per Gateway: with mergeGateways the filter is set per port from whichever
# merged listener carries it, so attaching it everywhere is deterministic.
# `optional: true` keeps connections WITHOUT a header working — in-cluster
# traffic (cert-manager's HTTP-01 self-check, anything hitting the LB IP from
# inside) never traverses the NodeBalancer. See #201 and the July incident.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: proxy-protocol
  namespace: choose-native-plants
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: choose-native-plants
  proxyProtocol:
    optional: true
